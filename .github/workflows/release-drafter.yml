name: Release Drafter

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches: ["develop"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update_release_draft:
    name: Update Release Draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Required to create and update the draft release.
      contents: write
      # Required to read the pull requests that make up the release notes.
      pull-requests: read
    steps:
      # Keeps a draft release up to date as PRs land on develop. Publishing that draft creates the
      # tag and fires the Publish workflow, which pushes the crate to crates.io.
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          commitish: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
