name: CI

on:
  push:
    branches: ["develop"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: spiraldb/actions/.github/actions/setup-rust@a746510eafaa926484c354541cfc49b2ec06cc63 # 0.18.6
        with:
          shared_key: "build"

      - name: Rust Build
        run: cargo build --all-features --all-targets
      - name: Rust Lint - Format
        run: cargo fmt --all --check
      - name: Rust Lint - Clippy
        run: cargo clippy --all-features --all-targets
      # Rustdoc warnings are denied through the lints table, so this fails on a broken intra-doc
      # link, which is also what would fail the docs.rs build.
      - name: Rust Lint - Docs
        run: cargo doc --all-features --no-deps
      - name: Rust Test
        run: cargo test --workspace --all-features

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    # CodSpeed uses OIDC when GitHub issues an ID token. Fork pull requests do not get one, and then
    # CodSpeed falls back to a tokenless upload, which it permits for public repositories.
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: spiraldb/actions/.github/actions/setup-rust@a746510eafaa926484c354541cfc49b2ec06cc63 # 0.18.6
        with:
          shared_key: "bench"

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-codspeed@5.0.1

      - name: Build benchmarks
        run: cargo codspeed build --all-features

      - name: Run benchmarks
        # CodSpeed 6 runs each benchmark in its own process by default. Keep all benchmarks in one
        # process, as before, so that results stay comparable with the earlier history.
        env:
          CODSPEED_PROCESS_ISOLATION: "false"
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5
        with:
          run: cargo codspeed run
          mode: "simulation"

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: spiraldb/actions/.github/actions/setup-rust@a746510eafaa926484c354541cfc49b2ec06cc63 # 0.18.6
        with:
          shared_key: "msrv"

      - name: Install cargo-msrv
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-msrv@0.19.3

      - name: Verify MSRV
        run: cargo msrv verify -- cargo check --all-features --all-targets --locked
