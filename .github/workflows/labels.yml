name: PR Labels

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

jobs:
  check_changelog_label:
    name: Validate Changelog Label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - name: Get PR Labels from API
        id: get_labels_api
        # v3.0.0
        uses: >-
          octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        with:
          route: GET /repos/{owner}/{repo}/issues/{pull_number}/labels
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          pull_number: ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and Check Labels
        env:
          API_RESPONSE: ${{ steps.get_labels_api.outputs.data }}
        run: |
          CHANGELOG_LABELS=(
            "breaking"
            "feature"
            "enhancement"
            "dependencies"
            "bug"
            "fix"
            "documentation"
            "skip-changelog"
          )

          current_labels=$(jq -r '.[].name' <<< "$API_RESPONSE")
          found_labels=()
          for label in "${CHANGELOG_LABELS[@]}"; do
            if grep -Fxq "$label" <<< "$current_labels"; then
              found_labels+=("$label")
            fi
          done

          label_count=${#found_labels[@]}
          if [ "$label_count" -eq 0 ]; then
            message="Pull request is missing a changelog label."
            message+=" Add exactly one of: ${CHANGELOG_LABELS[*]}."
            echo "::error file=.github/workflows/labels.yml::$message"
            exit 1
          elif [ "$label_count" -gt 1 ]; then
            message="Pull request has multiple changelog labels"
            message+=" (${found_labels[*]}). Keep exactly one."
            echo "::error file=.github/workflows/labels.yml::$message"
            exit 1
          fi

          echo "Found one changelog label: ${found_labels[0]}"
