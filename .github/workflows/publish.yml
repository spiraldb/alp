name: Publish

concurrency:
  group: publish
  cancel-in-progress: false

# Publishing a release draft (see release-drafter.yml) creates the tag and triggers this workflow.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: spiraldb/actions/.github/actions/setup-rust@a746510eafaa926484c354541cfc49b2ec06cc63 # 0.18.6
        with:
          shared_key: "publish"

      - name: Install cargo-edit
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-edit@0.13.10

      # The release tag is the source of truth for the version, so Cargo.toml on develop stays at
      # whatever was last released and gets rewritten here instead of in a release PR. Tags are
      # unprefixed; the `#v` tolerates the pre-0.0.3 `v` prefix on a hand-cut tag.
      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: cargo set-version --workspace "${TAG#v}"

      - name: Publish
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
